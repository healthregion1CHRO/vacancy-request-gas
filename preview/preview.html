  'modal-close': closeModal,
  sel: el => { const id = el.dataset.id; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); refreshList(); },
  'sel-all': el => { const rows = filtered(false).slice(0, S.limit); if (el.checked) rows.forEach(r => S.sel.add(r.id)); else rows.forEach(r => S.sel.delete(r.id)); refreshList(); },
  'sel-clear': () => { S.sel.clear(); refreshList(); },
  bulk: el => reviewModal(Array.from(S.sel), el.dataset.st),
  'f-status': el => { S.filters.status = el.dataset.st; S.navKey = isAdmin() && el.dataset.st === 'รอพิจารณา' ? 'review' : 'list'; S.sel.clear(); renderNav(); $('#pageTitle').textContent = S.navKey === 'review' ? 'รอพิจารณา' : TITLES.list; refreshList(); },
  'clear-filters': () => { S.filters = blankFilters(); renderView(); },
  more: () => { S.limit += 100; refreshList(); },
  export: el => doExport(el),
  'export-json': el => doExportJson(el),
  import: () => importModal(),
  'pick-cat': el => {
    const cat = catOf(el.dataset.k);
    S.form = { catKey: cat.key, data: Object.assign({}, cat.defaults || {}, S.boot.user.role === 'unit' ? { org: S.boot.user.org } : {}) };
    renderView(); window.scrollTo(0, 0);
  },
  'change-cat': () => { S.form = null; renderView(); },
  'cancel-form': () => { const editing = S.form && S.form.id; S.form = null; if (editing) go('list'); else renderView(); },
  'save-req': el => saveReq(el, !!el.dataset.more),
  'edit-req': el => {
    const r = S.reqs.find(x => x.id === el.dataset.id);
    S.form = { id: r.id, catKey: r.catKey, data: Object.assign({}, r) };
    closeDrawer(); go('new', { keepForm: true });
  },
  'withdraw-req': async el => {
    const id = el.dataset.id;
    if (!await confirmBox(`ถอนเรื่องคำขอ <b>${esc(id)}</b>? คำขอจะไม่ถูกนำเข้าที่ประชุม`, { title: 'ถอนเรื่อง', ok: 'ถอนเรื่อง', danger: true })) return;
    try { upsert(await api('apiWithdraw', id)); closeDrawer(); refreshList(); renderNav(); toast('ถอนเรื่อง ' + id + ' แล้ว'); } catch (e) { fail(e); }
  },
  'delete-req': async el => {
    const id = el.dataset.id;
    if (!await confirmBox(`ลบคำขอ <b>${esc(id)}</b> ออกจากระบบถาวร? (ย้อนกลับไม่ได้ — ถ้าหน่วยงานยกเลิกเอง ใช้สถานะ "ถอนเรื่อง" แทน)`, { title: 'ลบคำขอ', ok: 'ลบถาวร', danger: true })) return;
    try { await api('apiDeleteRequest', id); S.reqs = S.reqs.filter(r => r.id !== id); closeDrawer(); refreshList(); renderNav(); toast('ลบ ' + id + ' แล้ว'); } catch (e) { fail(e); }
  },
  'rv-pick': el => {
    $$('#rvPanel .seg button').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-checked', b === el); });
    const res = $('#rvResult'), st = el.dataset.st, prev = S.boot.statuses.map(s => s.key);
    if (!res.value || prev.indexOf(res.value) >= 0) res.value = ['เห็นชอบ', 'อนุมัติ', 'ไม่เห็นชอบ', 'ชะลอ'].indexOf(st) >= 0 ? st : '';
    if (st === 'ส่งกลับแก้ไข') $('#rvNote2').focus();
  },
  'rv-save': el => withBtn(el, async () => {
    const on = $('#rvPanel .seg .on'), note = $('#rvNote2').value.trim();
    if (!on) { toast('เลือกสถานะก่อน', 'err'); return; }
    if (on.dataset.st === 'ส่งกลับแก้ไข' && !note) { toast('กรุณาระบุข้อเสนอแนะว่าต้องแก้ไขอะไร', 'err'); $('#rvNote2').focus(); return; }
    try {
      const out = await api('apiReview', [el.dataset.id], on.dataset.st, $('#rvResult').value, note);
      out.forEach(upsert); refreshList(); renderNav(); openDrawer(el.dataset.id); toast('บันทึกผลการพิจารณาแล้ว');
    } catch (e) { fail(e); }
  }),
  theme: () => { toggleTheme(); if ($('#modal')) accountModal(); },
  account: accountModal,
  chpw: () => changePwModal(false),
  logout: logout,
  'pw-toggle': el => { const i = $('#' + el.dataset.for); i.type = i.type === 'password' ? 'text' : 'password'; },
  stab: el => { S.settingsTab = el.dataset.k; renderView(); },
  'user-add': () => userModal(null),
  'user-edit': el => userModal(S.users.find(u => u.username === el.dataset.u)),
  'user-reset': (el, e) => {
    e.stopPropagation();
    setPwModal(el.dataset.u);
  },
  'round-add': () => roundModal(null),
  'user-del': async (el, e) => {
    e.stopPropagation();
    const un = el.dataset.u;
    if (!await confirmBox(`ลบผู้ใช้ <b>${esc(un)}</b> ออกจากระบบถาวร? (ย้อนกลับไม่ได้ — คำขอที่ผู้ใช้นี้เคยส่งยังอยู่ครบ · ถ้าแค่ต้องการระงับชั่วคราว ให้ปิดใช้งานแทน)`, { title: 'ลบผู้ใช้', ok: 'ลบถาวร', danger: true })) return;
    try { await api('apiDeleteUser', un); S.users = S.users.filter(u => u.username !== un); refreshSettings(); toast('ลบผู้ใช้ ' + un + ' แล้ว'); } catch (err) { fail(err); }
  },
  'round-edit': el => roundModal(roundOf(el.dataset.id)),
  'round-del': async el => {
    const r = roundOf(el.dataset.id), n = S.reqs.filter(x => String(x.round) === String(r.id)).length;
    if (n) { toast(`รอบ "${r.name}" มีคำขอ ${n} รายการ — ลบหรือย้ายคำขอออกก่อนจึงจะลบรอบได้`, 'err'); return; }
    if (!await confirmBox(`ลบรอบ <b>${esc(r.name)}</b> ออกจากระบบถาวร? (ย้อนกลับไม่ได้)`, { title: 'ลบรอบการประชุม', ok: 'ลบถาวร', danger: true })) return;
    try {
      S.boot.rounds = await api('apiDeleteRound', r.id);
      if (String(S.round) === String(r.id)) S.round = String((openRound() || S.boot.rounds[S.boot.rounds.length - 1] || { id: '' }).id);
      refreshSettings(); renderRoundPick(); toast('ลบรอบ ' + r.name + ' แล้ว');
    } catch (err) { fail(err); }
  },
  'org-add': () => { S.orgDraft.push({ org: '', prov: S.boot.provinces[0], logo: '' }); refreshSettings(); const ins = $$('[data-org][data-k="org"]'); ins[ins.length - 1].focus(); },
  'org-del': el => { S.orgDraft.splice(Number(el.dataset.i), 1); refreshSettings(); },
  'org-reset': () => { S.orgDraft = null; refreshSettings(); },
  'org-save': el => withBtn(el, async () => {
    try { S.boot.orgs = await api('apiSaveOrgs', S.orgDraft.filter(o => o.org.trim())); S.orgDraft = null; refreshSettings(); toast('บันทึกรายชื่อหน่วยงานแล้ว'); } catch (e) { fail(e); }
  })
};

const CHG = {
  round: el => { S.round = el.value; S.sel.clear(); renderNav(); renderView(); },
  'f-cat': el => { S.filters.cat = el.value; S.sel.clear(); refreshList(); },
  'f-prov': el => { S.filters.prov = el.value; S.filters.org = ''; S.sel.clear(); renderView(); },
  'f-org': el => { S.filters.org = el.value; S.sel.clear(); refreshList(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const m = $('#modal');
    if (m) { if (!m.dataset.locked) closeModal(); } else if ($('.drawer')) closeDrawer();
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex], .nav a')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el);
  if (e.target.closest('#reqForm')) formInput(e.target);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.filters.q = t.value; debounce(refreshList, 150)(); }
  if (t.closest('#reqForm')) formInput(t);
  if (t.dataset.org !== undefined && S.orgDraft) {
    S.orgDraft[Number(t.dataset.org)][t.dataset.k] = t.value;
    if (t.dataset.k === 'logo') { const im = t.parentNode.querySelector('img.orglogo'); if (im) im.src = logoSrc(t.value) || MOPH_LOGO; }
  }
});
window.addEventListener('scroll', () => { const t = $('#top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* เบราว์เซอร์เก่า */ }

/* ───────────── start ───────────── */
applyTheme();
S.token = store.get('vr_token');
if (S.token) {
  $('#root').innerHTML = `<div style="min-height:100vh;display:grid;place-items:center"><div class="row muted"><span class="spin" style="width:20px;height:20px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite"></span> กำลังโหลด…</div></div>`;
  api('apiBootstrap').then(b => { S.boot = b; startApp(); }).catch(e => { if (!e.silent) renderLogin(); });
} else {
  renderLogin();
}
})();
</script>
</body>
</html>
