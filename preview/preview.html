<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบคำขอใช้ตำแหน่งว่าง · เขตสุขภาพที่ 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f7fb; --surface:#ffffff; --surface-alt:#eef5fb; --border:#d6e3ee; --border-strong:#b9cddd;
  --ink:#0f2233; --ink-2:#3d5366; --muted:#6b8193;
  --accent:#0a6ab4; --accent-strong:#08538e; --accent-soft:#deedf9; --on-accent:#ffffff;
  --brand:#1d7a45; --brand-strong:#145e34; --brand-soft:#e3f2e8;
  --ok:#1d7a45; --ok-soft:#e3f2e8; --warn:#b45309; --warn-soft:#fdf0dc; --bad:#c0262d; --bad-soft:#fde7e8;
  --wait:#0a6ab4; --wait-soft:#deedf9; --hold:#6d3fc0; --hold-soft:#efe7fb; --mute:#64748b; --mute-soft:#eef1f5;
  --shadow:0 1px 2px rgba(15,34,51,.06),0 4px 16px rgba(15,34,51,.06);
  --shadow-lg:0 12px 40px rgba(15,34,51,.18);
  --radius:14px; --radius-sm:10px; --btn-border:4px;
  /* โทน น้ำเงิน · เขียว · ดำ: แถบเมนูและการ์ดเด่นใช้พื้นดำ */
  --black:#0b1118; --side-bg:#0b1118; --side-ink:#eef3f7; --side-muted:#93a3b1; --side-hover:rgba(255,255,255,.07);
  --side-on-bg:rgba(47,164,99,.18); --side-on:#6fe0a0; --brand-bright:#2fa463;
  --font:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif; --font-head:'Sarabun','Noto Sans Thai',sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d1620; --surface:#13202c; --surface-alt:#182837; --border:#273b4e; --border-strong:#36506a;
  --ink:#e6eef5; --ink-2:#b4c4d2; --muted:#8aa0b3;
  --accent:#5ab3f2; --accent-strong:#8bcaf6; --accent-soft:#122d44; --on-accent:#07141f;
  --brand:#5ccf88; --brand-strong:#86e0a8; --brand-soft:#153322;
  --ok:#5ccf88; --ok-soft:#153322; --warn:#f2b45a; --warn-soft:#3a2a12; --bad:#f2787d; --bad-soft:#3d1a1d;
  --wait:#5ab3f2; --wait-soft:#122d44; --hold:#b79af0; --hold-soft:#2a2045; --mute:#94a3b8; --mute-soft:#1e2a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark; --black:#05080c; --side-bg:#070b10; --side-ink:#e6eef5; --side-muted:#8aa0b3; --side-hover:rgba(255,255,255,.06);
}}
:root[data-theme="dark"]{
  --bg:#0d1620; --surface:#13202c; --surface-alt:#182837; --border:#273b4e; --border-strong:#36506a;
  --ink:#e6eef5; --ink-2:#b4c4d2; --muted:#8aa0b3;
  --accent:#5ab3f2; --accent-strong:#8bcaf6; --accent-soft:#122d44; --on-accent:#07141f;
  --brand:#5ccf88; --brand-strong:#86e0a8; --brand-soft:#153322;
  --ok:#5ccf88; --ok-soft:#153322; --warn:#f2b45a; --warn-soft:#3a2a12; --bad:#f2787d; --bad-soft:#3d1a1d;
  --wait:#5ab3f2; --wait-soft:#122d44; --hold:#b79af0; --hold-soft:#2a2045; --mute:#94a3b8; --mute-soft:#1e2a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark; --black:#05080c; --side-bg:#070b10; --side-ink:#e6eef5; --side-muted:#8aa0b3; --side-hover:rgba(255,255,255,.06);
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.25}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none!important}
.mobile-only{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── progress bar ── */
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s}
#busy.on{opacity:1}
#busy::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,var(--brand),var(--accent));animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:10px;border:var(--btn-border) solid var(--muted);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2);background:var(--surface-alt)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.input:focus-visible,.nav a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--ink)}
.btn.brand{background:var(--brand);border-color:var(--brand-strong);color:#fff}
.btn.brand:hover{background:var(--brand-strong)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-alt)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:32px;padding:2px 10px;font-size:14px;border-radius:8px}
.btn.icon{padding:0;width:40px}
.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── form ── */
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:84px;resize:vertical}
.input:hover{border-color:var(--border-strong)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input.err{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-weight:600;font-size:14px;color:var(--ink-2)}
.field>label .req{color:var(--bad);margin-left:2px}
.field .hint{font-size:13px;color:var(--muted)}
.field .msg{font-size:13px;color:var(--bad)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2} .spanall{grid-column:1/-1}
.input-wrap{position:relative}
.input-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input-wrap .input{padding-left:38px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--border-strong);position:relative;cursor:pointer;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--brand)} .toggle input:checked::after{transform:translateX(18px)}

/* ── login ── */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(1200px 600px at 10% -10%,#2fa463 0,transparent 55%),radial-gradient(900px 700px at 110% 110%,#0a6ab4 0,transparent 55%),linear-gradient(135deg,#145e34,#08538e)}
.login-art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.login-art>*{position:relative}
.login-art h1{font-size:40px;font-weight:700;margin:12px 0 10px}
.login-art p{opacity:.88;max-width:440px;margin:0}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-card{width:100%;max-width:400px}
.login-card h2{font-size:28px;margin-bottom:6px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:#fff;padding:3px;border:2px solid rgba(255,255,255,.6)}
.orglogo{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
.orglogo-box{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--border);padding:2px;display:block}
.pw-wrap{position:relative} .pw-wrap .btn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.alert.info{background:var(--accent-soft);color:var(--accent-strong)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert .ico{margin-top:2px}

/* ── shell ── */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--border)}
.brandbox{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}
.brandbox .mark{width:46px;height:46px;flex:none;border-radius:50%;padding:2px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brandbox small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brandbox b{display:block;font-family:var(--font-head);font-size:16px;line-height:1.2}
.brandbox small{color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;cursor:pointer;position:relative}
.nav a:hover{background:var(--surface-alt);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav .badge{margin-left:auto}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-alt)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--brand));flex:none}
.me b{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me>div:not(.avatar){min-width:0;flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--border)}
.top h1{font-size:22px;flex:1;min-width:0}
.round-pick{display:flex;align-items:center;gap:8px}
.round-pick select{min-width:220px}
.content{padding:8px 28px 40px;max-width:1280px;width:100%}
.bottomnav{display:none}

/* ── cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:17px;flex:1}
.card-b{padding:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.welcome{padding:26px;color:#fff;border:none;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--brand-strong),var(--brand) 45%,var(--accent))}
.welcome::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.welcome h2{font-size:26px;margin-bottom:6px}
.welcome p{margin:0 0 18px;opacity:.9}
.welcome .btn{background:#fff;color:var(--brand-strong);border-color:#fff}
.welcome .btn.glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.roundcard{border:3px solid var(--border-strong);padding:22px;display:flex;flex-direction:column;gap:12px}
.roundcard .big{font-family:var(--font-head);font-size:22px;font-weight:700}
.countdown{display:flex;align-items:baseline;gap:6px}
.countdown b{font-size:34px;font-family:var(--font-head);color:var(--accent);line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .ic .ico{width:22px;height:22px}
.kpi b{display:block;font-size:28px;font-family:var(--font-head);line-height:1.1}
.kpi small{color:var(--muted);font-size:13px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14px;cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px}
.bar:hover{background:var(--surface-alt)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;border-radius:99px;background:var(--surface-alt);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}

.feed{display:flex;flex-direction:column}
.feed-i{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.feed-i:last-child{border-bottom:none}
.feed-i:hover b{color:var(--accent)}
.feed-i .t{flex:1;min-width:0}
.feed-i b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-i small{color:var(--muted);font-size:13px}

/* ── chips ── */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--mute-soft);color:var(--mute)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.t-wait{background:var(--wait-soft);color:var(--wait)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.t-hold{background:var(--hold-soft);color:var(--hold)} .t-mute{background:var(--mute-soft);color:var(--mute)}
.cattag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.cattag i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.cattag i .ico{width:13px;height:13px}

/* ── category picker ── */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.catcard{text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--radius);border:4px solid color-mix(in srgb,var(--c) 40%,var(--border));background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.catcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--c)}
.catcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.catcard .ic .ico{width:22px;height:22px}
.catcard b{font-size:16px;font-family:var(--font-head)}
.catcard p{margin:0;font-size:14px;color:var(--muted)}
.catcard .staff{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.02em}

/* ── request form ── */
.formhead{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border)}
.formhead .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.formhead .ic .ico{width:24px;height:24px}
.formhead h2{font-size:20px}
.sec{padding:20px;border-bottom:1px solid var(--border)}
.sec:last-of-type{border-bottom:none}
.sec h4{margin:0 0 14px;font-size:14px;letter-spacing:.03em;color:var(--brand);display:flex;align-items:center;gap:8px}
.sec h4 .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:12px}
.shortbox{display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:12px;background:var(--surface-alt);padding:8px;min-height:68px}
.shortbox b{font-size:26px;font-family:var(--font-head);line-height:1}
.shortbox small{color:var(--muted);font-size:12px}
.shortbox.pos b{color:var(--bad)} .shortbox.over b{color:var(--warn)} .shortbox.zero b{color:var(--ok)}
.formfoot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius)}

/* ── list ── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.toolbar .input-wrap{flex:1 1 260px}
.toolbar select.input{width:auto;min-width:150px;flex:0 1 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
.tab{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;border:var(--btn-border) solid var(--muted);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.tab:hover{border-color:var(--border-strong)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab .n{font-size:12px;padding:0 7px;border-radius:99px;background:var(--surface-alt);color:var(--ink-2)}
.tab.on .n{background:color-mix(in srgb,var(--surface) 22%,transparent);color:var(--surface)}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{position:sticky;top:0;text-align:left;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-alt)}
.tbl tbody tr.sel{background:var(--accent-soft)}
.tbl .id{font-weight:700;color:var(--accent);white-space:nowrap}

let busyN = 0;
function busy(d) { busyN = Math.max(0, busyN + d); const b = $('#busy'); b && b.classList.toggle('on', busyN > 0); }

function api(fn, ...args) {
  busy(1);
  return new Promise((resolve, reject) => {
    const gs = window.google && google.script && google.script.run;
    if (gs) gs.withSuccessHandler(resolve).withFailureHandler(reject)[fn](S.token, ...args);
    // หน้าที่อยู่นอก Apps Script (GitHub Pages) → ส่งไปที่ doPost ของเว็บแอป; text/plain เพื่อไม่ให้ติด CORS preflight
    else if (window.REMOTE_URL) fetch(window.REMOTE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args: [S.token, ...args] }) })
      .then(r => r.json())
      .then(res => res.ok ? resolve(res.data) : reject(new Error(res.error)),
        () => reject(new Error('ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ต หรือการ Deploy (Who has access = Anyone)')));
    else if (window.MockServer) window.MockServer.call(fn, [S.token, ...args]).then(resolve, reject);
    else reject(new Error('เปิดหน้านี้ผ่านลิงก์เว็บแอปของ Google Apps Script'));
  }).then(v => { busy(-1); return v; }, err => {
    busy(-1);
    const msg = String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '');
    if (msg.indexOf('SESSION_EXPIRED') >= 0) {
      endSession('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง');
      const e = new Error(msg); e.silent = true; throw e;
    }
    throw new Error(msg);
  });
}

function parseD(s) { if (!s) return null; const d = new Date(String(s).length === 10 ? s + 'T00:00:00' : s); return isNaN(d) ? null : d; }
function fmtDate(s, long) {
  const d = parseD(s); if (!d) return '–';
  return d.toLocaleDateString('th-TH', long ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'short', year: '2-digit' });
}
function fmtDT(s) { const d = parseD(s); return d ? fmtDate(s) + ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : '–'; }
function ago(s) {
  const d = parseD(s); if (!d) return '';
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return 'เมื่อสักครู่'; if (m < 60) return m + ' นาทีที่แล้ว';
  const h = Math.round(m / 60); if (h < 24) return h + ' ชม.ที่แล้ว';
  const dd = Math.round(h / 24); return dd < 30 ? dd + ' วันที่แล้ว' : fmtDate(s);
}
function daysLeft(s) { const d = parseD(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 86400000); }
const initials = n => (String(n || '?').trim().replace(/^(นางสาว|นาย|นาง|น\.ส\.|ดร\.)\s*/, '')[0] || '?').toUpperCase();

/* ───────────── toast / modal / drawer ───────────── */
function toast(msg, type) {
  type = type || 'ok';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = icon(type === 'err' ? 'alert' : 'check') + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, type === 'err' ? 5500 : 3000);
}

function modal(o) {
  closeModal();
  const w = document.createElement('div');
  w.className = 'modal-wrap'; w.id = 'modal';
  if (o.locked) w.dataset.locked = '1';
  w.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
    <div class="modal-h"><h3>${esc(o.title)}</h3>${o.locked ? '' : `<button class="btn ghost icon sm" data-act="modal-close" aria-label="ปิด">${icon('x')}</button>`}</div>
    <div class="modal-b">${o.body}</div>${o.foot ? `<div class="modal-f">${o.foot}</div>` : ''}</div>`;
  if (!o.locked) w.addEventListener('mousedown', e => { if (e.target === w) closeModal(); });
  document.body.appendChild(w);
  if (o.onMount) o.onMount(w);
  const f = w.querySelector('.modal-b input:not([readonly]),.modal-b select,.modal-b textarea:not([readonly])');
  if (f) f.focus();
  return w;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function confirmBox(html, o) {
  o = o || {};
  return new Promise(res => {
    const w = modal({ title: o.title || 'ยืนยัน', body: `<div>${html}</div>`,
      foot: `<button class="btn" data-x="no">ยกเลิก</button><button class="btn ${o.danger ? 'danger' : 'primary'}" data-x="yes">${esc(o.ok || 'ยืนยัน')}</button>` });
    w.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) { closeModal(); res(b.dataset.x === 'yes'); } });
  });
}
async function withBtn(btn, fn) {
  if (!btn) return fn();
  const html = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + html.replace(/<svg[\s\S]*?<\/svg>/, '');
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
}
function copyText(text) {
  const done = () => toast('คัดลอกแล้ว');
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('คัดลอกไม่ได้ กรุณาเลือกข้อความแล้วกด Ctrl+C', 'err'); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
/** บันทึกไฟล์: ใน claude.ai artifact ต้องผ่าน downloads capability (ผู้ชมกดยืนยัน) · ที่อื่นใช้ลิงก์ดาวน์โหลดปกติ */
async function download(name, data, type) {
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (dl) {
    try { await dl.save({ filename: name, data: data }); }
    catch (e) { if (e && e.code !== 'declined') toast('ดาวน์โหลดไม่ได้ในหน้านี้ (' + (e.code || e.message) + ')', 'err'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: type || 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/** ลิงก์รูปตราในชีต: ลิงก์แชร์ Google Drive → ลิงก์รูปโดยตรง, ลิงก์รูปทั่วไปใช้ตามเดิม */
function logoSrc(url) {
  url = String(url || '').trim();
  if (!/^https:\/\//i.test(url)) return '';
  const m = /drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/.exec(url);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] + '=w200' : url;
}
/** ตราของผู้ใช้ที่ล็อกอิน: หน่วยงาน → ตราหน่วยงาน (ถ้ามี), นอกนั้น → ตรากระทรวง */
function myLogo() {
  const u = S.boot && S.boot.user;
  const o = u && u.role === 'unit' ? S.boot.orgs.find(x => x.org === u.org) : null;
  return (o && logoSrc(o.logo)) || MOPH_LOGO;
}
/** <img> ตรา — โหลดไม่ได้ (ลิงก์เสีย/ไม่ได้แชร์) ตัวดัก error ด้านล่างเปลี่ยนเป็นตรากระทรวง */
function logoImg(src, alt) {
  return `<img class="orglogo" src="${esc(src || MOPH_LOGO)}" alt="${esc(alt || 'ตราหน่วยงาน')}" referrerpolicy="no-referrer">`;
}
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('orglogo') && t.src !== MOPH_LOGO) t.src = MOPH_LOGO;
}, true);

function renderLogin(msg) {
  S.boot = null;
  $('#root').innerHTML = `
  <div class="login">
    <section class="login-art">
      <div>
        <span class="logo">${logoImg(MOPH_LOGO, 'ตรากระทรวงสาธารณสุข')}</span>
        <h1>ระบบคำขอใช้ตำแหน่งว่าง</h1>
        <p>เขตสุขภาพที่ 1 · ส่งคำขอ ติดตามสถานะ และพิจารณาผลในที่เดียว แทนการรวบรวมไฟล์ Excel ทุกเดือน</p>
      </div>
      <small style="opacity:.75">ข้าราชการ · พนักงานราชการ · พนักงานกระทรวงสาธารณสุข · ลูกจ้างชั่วคราว</small>
    </section>
    <section class="login-form">
      <form class="login-card stack" id="loginForm" autocomplete="on">
        <div><h2>เข้าสู่ระบบ</h2><p class="muted" style="margin:0">ใช้ชื่อผู้ใช้และรหัสผ่านที่ได้รับจากเขต</p></div>
        ${msg ? `<div class="alert info">${icon('alert')}<span>${esc(msg)}</span></div>` : ''}
        <div class="alert" id="loginErr" hidden></div>
        <div class="field"><label for="lu">ชื่อผู้ใช้</label>
          <div class="input-wrap">${icon('user')}<input class="input" id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div></div>
        <div class="field"><label for="lp">รหัสผ่าน</label>
          <div class="input-wrap pw-wrap">${icon('key')}<input class="input" id="lp" type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="btn ghost sm icon" data-act="pw-toggle" data-for="lp" aria-label="แสดงรหัสผ่าน">${icon('eye')}</button></div></div>
        <button class="btn primary" type="submit" style="min-height:46px">เข้าสู่ระบบ ${icon('arrowRight')}</button>
        <p class="muted" style="font-size:13px;margin:0">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบของเขตเพื่อรีเซ็ต</p>
        ${/^_/.test(PAGE_BUILD) ? '' : `<p class="muted" style="font-size:11px;margin:0">รุ่น ${esc(PAGE_BUILD)}</p>`}
        <div class="alert" id="verWarn" hidden></div>
      </form>
    </section>
  </div>`;
  checkServerBuild();
  const form = $('#loginForm');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#loginErr'); err.hidden = true;
    if (!$('#lu').value.trim() || !$('#lp').value) { err.innerHTML = icon('alert') + '<span>กรุณากรอกชื่อผู้ใช้และรหัสผ่าน</span>'; err.hidden = false; return; }
    await withBtn(form.querySelector('[type=submit]'), async () => {
      try {
        const res = await api('apiLogin', $('#lu').value, $('#lp').value);
        S.token = res.token; store.set('vr_token', res.token); S.boot = res.boot;
        startApp();
      } catch (ex) { err.innerHTML = icon('alert') + '<span>' + esc(ex.message) + '</span>'; err.hidden = false; }
    });
  });
  $('#lu').focus();
}

function endSession(msg) {
  S.token = null; store.set('vr_token', null);
  Object.assign(S, { reqs: [], loaded: false, users: null, form: null, round: null, filters: blankFilters(), view: 'home', navKey: 'home' });
  S.sel.clear(); closeModal(); closeDrawer();
  renderLogin(msg);
}

/* ───────────── shell ───────────── */
function startApp() {
  if (S.round === null) S.round = String((openRound() || S.boot.rounds[S.boot.rounds.length - 1] || { id: '' }).id);
  renderShell();
  loadReqs();
  if (S.boot.user.mustChange) changePwModal(true);
}
async function loadReqs() {
  S.loaded = false; renderView();
  try { S.reqs = await api('apiListRequests', ''); S.loaded = true; renderNav(); renderView(); } catch (e) { fail(e); }
}

const NAV = () => [
  { v: 'home', t: 'ภาพรวม', s: 'ภาพรวม', i: 'home' },
  { v: 'new', t: 'ส่งคำขอ', s: 'ส่งคำขอ', i: 'plus' },
  { v: 'list', t: 'รายการคำขอ', s: 'รายการ', i: 'list', badge: isAdmin() ? null : 'ส่งกลับแก้ไข' }
].concat(isAdmin() ? [
  { v: 'review', t: 'รอพิจารณา', s: 'พิจารณา', i: 'clipboard', badge: 'รอพิจารณา' },
  { v: 'settings', t: 'ตั้งค่า', s: 'ตั้งค่า', i: 'sliders' }
] : []);

function renderShell() {
  const u = S.boot.user;
  const who = esc(u.roleName) + (u.org ? ' · ' + esc(u.org) : u.prov ? ' · ' + esc(u.prov) : '');
  $('#root').innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brandbox"><div class="mark">${logoImg(myLogo(), u.role === 'unit' ? 'ตรา' + u.org : 'ตรากระทรวงสาธารณสุข')}</div><div><b>คำขอใช้ตำแหน่งว่าง</b><small>${esc(u.role === 'unit' && u.org ? u.org : S.boot.app.region)}</small></div></div>
      <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
      <div class="side-foot">
        <button class="btn ghost" data-act="theme" style="justify-content:flex-start">${icon('moon')}<span id="themeLbl"></span></button>
        <div class="me"><div class="avatar">${esc(initials(u.name || u.username))}</div>
          <div><b>${esc(u.name || u.username)}</b><small>${who}</small></div>
          <button class="btn ghost sm icon" data-act="account" aria-label="บัญชีของฉัน">${icon('more')}</button></div>
      </div>
    </aside>
    <div class="main">
      <header class="top" id="top">
        <h1 id="pageTitle"></h1>
        <div class="round-pick" id="roundPick"></div>
        <button class="btn ghost icon mobile-only" data-act="account" aria-label="บัญชีของฉัน"><span class="avatar" style="width:32px;height:32px;font-size:13px">${esc(initials(u.name || u.username))}</span></button>
      </header>
      <main class="content" id="view"></main>
    </div>
    <nav class="bottomnav" id="bnav" aria-label="เมนูหลัก"></nav>
  </div>`;
  renderNav(); renderRoundPick(); applyTheme();
}

function renderNav() {
  if (!$('#nav')) return;
  const sc = scoped();
  const items = NAV().map(n => {
    const cnt = n.badge ? sc.filter(r => r.status === n.badge).length : 0;
    return { n: n, on: S.navKey === n.v, b: cnt ? `<span class="badge">${cnt}</span>` : '' };
  });
  $('#nav').innerHTML = items.map(x => `<a data-act="go" data-v="${x.n.v}" class="${x.on ? 'on' : ''}" ${x.on ? 'aria-current="page"' : ''} tabindex="0">${icon(x.n.i)}<span>${x.n.t}</span>${x.b}</a>`).join('');
  $('#bnav').innerHTML = items.map(x => `<a data-act="go" data-v="${x.n.v}" class="${x.on ? 'on' : ''}">${icon(x.n.i)}<span>${x.n.s}</span>${x.b}</a>`).join('');
}

function renderRoundPick() {
  const opts = S.boot.rounds.slice().reverse().map(r => `<option value="${esc(r.id)}" ${String(S.round) === String(r.id) ? 'selected' : ''}>${esc(r.name)}${r.month ? ' · ' + esc(r.month) : ''}${isOpenR(r) ? ' (เปิดรับ)' : ''}</option>`).join('');
  $('#roundPick').innerHTML = `${icon('calendar', 'muted')}<select class="input" data-change="round" aria-label="เลือกรอบการประชุม"><option value="">ทุกรอบการประชุม</option>${opts}</select>`;
}

function go(v, opt) {
  opt = opt || {};
  S.navKey = v;
  if (v === 'review') { S.view = 'list'; if (!opt.keepFilters) { S.filters = blankFilters(); S.filters.status = 'รอพิจารณา'; } }
  else { S.view = v; if (v === 'list' && !opt.keepFilters) S.filters = blankFilters(); }
  if (v === 'new' && !opt.keepForm) S.form = null;
  if (v === 'settings') S.orgDraft = null;
  S.sel.clear(); S.limit = 100;
  renderNav(); renderView(); window.scrollTo(0, 0);
}

const TITLES = { home: 'ภาพรวม', new: 'ส่งคำขอใช้ตำแหน่ง', list: 'รายการคำขอ', settings: 'ตั้งค่าระบบ' };
function renderView() {
  if (!$('#view')) return;
  const v = S.view;
  $('#pageTitle').textContent = v === 'new' && S.form && S.form.id ? 'แก้ไขคำขอ ' + S.form.id : S.navKey === 'review' ? 'รอพิจารณา' : TITLES[v];
  $('#roundPick').style.display = (v === 'settings' || v === 'new') ? 'none' : '';
  const el = $('#view');
  if (v === 'home') el.innerHTML = viewHome();
  else if (v === 'new') el.innerHTML = viewNew();
  else if (v === 'list') el.innerHTML = viewList();
  else if (v === 'settings') { el.innerHTML = viewSettings(); if (!S.users) loadUsers(); }
}

/* ───────────── home ───────────── */
function scoped() { return S.reqs.filter(r => !S.round || String(r.round) === String(S.round)); }

function barsHtml(rows, key) {
  if (!rows.length) return emptyHtml('inbox', 'ยังไม่มีคำขอ', 'เมื่อมีคำขอในรอบนี้ จะแสดงสรุปที่นี่');
  const max = Math.max.apply(null, rows.map(r => r.n));
  return `<div class="bars">${rows.map(r => `<div class="bar" data-act="bar" data-k="${key}" data-val="${esc(r.k)}" title="ดูรายการ ${esc(r.t)}">
    <span>${esc(r.t)}</span><div class="track"><div class="fill" style="width:${Math.max(3, r.n / max * 100)}%"></div></div><b>${r.n}</b></div>`).join('')}</div>`;
}

function viewHome() {
  if (!S.loaded) return `<div class="stack"><div class="hero"><div class="sk" style="height:190px"></div><div class="sk" style="height:190px"></div></div>

      <dl class="kv"><dt>บัญชีประจำเดือน</dt><dd>${esc(rd.month || '–')}</dd><dt>ปิดรับคำขอ</dt><dd>${fmtDate(rd.closeDate, 1)}</dd><dt>วันที่ประชุม</dt><dd>${fmtDate(rd.meetDate, 1)}</dd></dl>
      ${others.length ? `<p class="muted" style="margin:8px 0 0;font-size:13px">${icon('calendar')} เปิดรับพร้อมกันอีก: ${others.map(r => esc(r.name) + (r.month ? ' (' + esc(r.month) + ')' : '')).join(', ')} — เลือกดูได้ที่รอบด้านบน</p>` : ''}

  }

  const kpis = [
    ['คำขอทั้งหมด', live.length, 'inbox', 'wait', ''],
    ['รอพิจารณา', cnt(['รอพิจารณา']), 'clock', 'hold', 'รอพิจารณา'],
    ['ส่งกลับแก้ไข', returned, 'undo', 'warn', 'ส่งกลับแก้ไข'],
    ['เห็นชอบ / อนุมัติ', cnt(['เห็นชอบ', 'อนุมัติ']), 'check', 'ok', 'ผ่าน']
  ].map(k => `<div class="card kpi" data-act="kpi" data-st="${k[4]}" role="button" tabindex="0"><div class="ic t-${k[3]}">${icon(k[2])}</div><div><b class="mono">${k[1]}</b><small>${k[0]}</small></div></div>`).join('');

  const byCat = S.boot.cats.map(c => ({ k: c.key, t: c.name, n: live.filter(r => r.catKey === c.key).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  let second = '';
  if (u.role === 'admin') {
    const byProv = S.boot.provinces.map(p => ({ k: p, t: p, n: live.filter(r => r.prov === p).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
    second = `<div class="card"><div class="card-h"><h3>แยกตามจังหวัด</h3></div><div class="card-b">${barsHtml(byProv, 'prov')}</div></div>`;
  } else if (u.role === 'prov') {
    const byOrg = S.boot.orgs.map(o => ({ k: o.org, t: o.org, n: live.filter(r => r.org === o.org).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
    second = `<div class="card"><div class="card-h"><h3>แยกตามหน่วยงาน</h3></div><div class="card-b">${barsHtml(byOrg, 'org')}</div></div>`;
  }

  const feed = `<div class="card"><div class="card-h"><h3>ความเคลื่อนไหวล่าสุด</h3><button class="btn sm ghost" data-act="go" data-v="list">ดูทั้งหมด ${icon('arrowRight')}</button></div>
    <div class="card-b" style="padding-top:4px;padding-bottom:4px">${recent.length ? `<div class="feed">${recent.map(r => `<div class="feed-i" data-act="open" data-id="${esc(r.id)}">
      <div class="t"><b>${r.posno ? esc(r.posno) + ' · ' : ''}${esc(r.pos)}</b><small>${esc(r.id)} · ${esc(r.org)} · ${ago(r.reviewedAt || r.updatedAt)}</small></div>${chip(r.status)}</div>`).join('')}</div>`
      : emptyHtml('inbox', 'ยังไม่มีความเคลื่อนไหว', 'คำขอที่ส่งหรือพิจารณาแล้วจะแสดงที่นี่')}</div></div>`;

  return `<div class="stack">
    <div class="hero">
      <div class="card welcome">
        <h2>${greet}, ${esc((u.name || u.username).split(' ')[0])}</h2>
        <p>${esc(scopeTxt)}${returned ? ` · มี <b>${returned}</b> คำขอที่เขตส่งกลับให้แก้ไข` : ''}</p>
        <div class="row">

          ${!isAdmin() && returned ? `<button class="btn glass" data-act="kpi" data-st="ส่งกลับแก้ไข">${icon('undo')} ดูรายการที่ต้องแก้ไข</button>` : ''}
        </div>

      ${second || ''}
    </div>
    ${feed}

/* ───────────── new / edit request ───────────── */
function viewNew() {
  const or = defRound(), ors = openRounds();
  if (!S.form && !isAdmin() && !or) {
    return `<div class="card">${emptyHtml('calendar', 'ยังไม่เปิดรับคำขอ', 'ขณะนี้ไม่มีรอบการประชุมที่เปิดรับคำขอ กรุณาติดตามประกาศจากเขต')}</div>`;
  }
  if (!S.form) {
    return `<div class="stack">
      ${ors.length > 1 ? `<div class="alert info">${icon('calendar')}<span>ขณะนี้เปิดรับ ${ors.length} รอบ: ${ors.map(r => `<b>${esc(r.name)}</b>${r.month ? ' (' + esc(r.month) + ')' : ''}${r.closeDate ? ' ปิดรับ ' + fmtDate(r.closeDate, 1) : ''}`).join(' · ')} — เลือกรอบได้ในฟอร์ม</span></div>`
        : or ? `<div class="alert info">${icon('calendar')}<span>คำขอจะเข้าสู่ <b>${esc(or.name)}</b>${or.month ? ' (บัญชีเดือน' + esc(or.month) + ')' : ''}${or.closeDate ? ' · ปิดรับ ' + fmtDate(or.closeDate, 1) : ''}</span></div>` : ''}
      <div><h2 style="font-size:20px">เลือกประเภทคำขอ</h2><p class="muted" style="margin:4px 0 0">ฟอร์มจะแสดงเฉพาะช่องที่ประเภทนั้นต้องใช้</p></div>
      <div class="cats">${S.boot.cats.map(c => `<button class="catcard" style="--c:${catColor(c.key)}" data-act="pick-cat" data-k="${c.key}">
        <div class="ic">${icon(c.icon)}</div><span class="staff">${esc(c.staff)}</span><b>${esc(c.name)}</b><p>${esc(c.desc)}</p></button>`).join('')}</div>
    </div>`;
  }
  return formHtml();
}

function shortOf(d) {
  const f = d.frame, a = d.actual;
  return (f === '' || f == null || a === '' || a == null || isNaN(f) || isNaN(a)) ? '' : Number(f) - Number(a);
}

/** กรอบ − ปฏิบัติงานจริง → ขาด (กรอบมากกว่า) / เกิน (กรอบน้อยกว่า) / พอดีกรอบ */
function gapOf(sh) {
  if (sh === '' || sh == null || isNaN(sh)) return { t: '–', c: '' };
  sh = Number(sh);
  return sh > 0 ? { t: 'ขาด ' + sh, c: 'pos' } : sh < 0 ? { t: 'เกิน ' + -sh, c: 'over' } : { t: 'พอดีกรอบ', c: 'zero' };
}

function fieldHtml(cat, k, val, required, cls) {
  const F = cat.selects && cat.selects[k] ? Object.assign({}, S.boot.fields[k], { type: 'select', list: cat.selects[k] })
    : cat.lists && cat.lists[k] ? Object.assign({}, S.boot.fields[k], { list: cat.lists[k] })
    : cat.over && cat.over[k] ? Object.assign({}, S.boot.fields[k], cat.over[k]) : S.boot.fields[k], id = 'f_' + k, lbl = labelOf(cat, k), v = val == null ? '' : String(val);
  let ctl;
  if (F.type === 'org') {
    // หน่วยงานเลือกได้เฉพาะหน่วยงานในจังหวัดเดียวกัน (S.boot.orgs ส่งมาเฉพาะจังหวัดนั้น) ค่าเริ่มต้น = หน่วยงานของตนเอง
    const groups = orgOptions(v);
    ctl = `<select class="input" id="${id}" name="org"><option value="">— เลือกหน่วยงาน —</option>${groups}</select>`;
  } else if (F.type === 'select') {
    const list = S.boot.lists[F.list];
    ctl = `<select class="input" id="${id}" name="${k}"><option value="">— เลือก —</option>${list.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}${v && list.indexOf(v) < 0 ? `<option selected>${esc(v)}</option>` : ''}</select>`;
  } else if (F.type === 'combo') {
    ctl = `<input class="input" id="${id}" name="${k}" list="dl_${k}" value="${esc(v)}" placeholder="เลือกจากรายการ หรือพิมพ์เอง"><datalist id="dl_${k}">${S.boot.lists[F.list].map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
  } else if (F.type === 'textarea') {
    ctl = `<textarea class="input" id="${id}" name="${k}" rows="3" placeholder="${esc(F.ph || '')}">${esc(v)}</textarea>`;
  } else if (F.type === 'number') {
    ctl = `<input class="input mono" id="${id}" name="${k}" type="number" min="0" step="1" inputmode="numeric" value="${esc(v)}" placeholder="0">`;
  } else {
    ctl = `<input class="input ${F.mono ? 'mono' : ''}" id="${id}" name="${k}" type="${F.type === 'url' ? 'url' : 'text'}" value="${esc(v)}" placeholder="${esc(F.ph || '')}" ${k === 'posno' ? 'inputmode="numeric" autocomplete="off"' : ''}>`;
  }
  const hint = k === 'posno' ? `<span class="hint" id="posnoHint">${posnoHint(v)}</span>` : '';
  return `<div class="field ${cls || ''}" data-f="${k}"><label for="${id}">${esc(lbl)}${required ? '<span class="req">*</span>' : ''}</label>${ctl}${hint}<span class="msg" hidden></span></div>`;
}

/** แจ้งเตือนทันทีเมื่อเลขตำแหน่งนี้เคยมีคำขอแล้ว */
function posnoHint(v) {
  v = String(v || '').trim();
  if (!v) return '';
  const id = S.form && S.form.id;
  const hits = S.reqs.filter(r => r.posno === v && r.id !== id && r.status !== 'ถอนเรื่อง');
  if (!hits.length) return '';
  return `<span style="color:var(--warn)">${icon('alert')} เลขนี้มีคำขอแล้ว ${hits.length} รายการ: ${hits.slice(0, 2).map(r => esc(r.id) + ' (' + esc(r.status) + (roundOf(r.round) ? ', ' + esc(roundOf(r.round).name) : '') + ')').join(', ')}</span>`;
}

function formHtml() {
  const f = S.form, cat = catOf(f.catKey), d = f.data, B = S.boot;
  const req = ['org', 'unit'].concat(cat.required || []);
  const fld = (k, cls) => fieldHtml(cat, k, d[k], req.indexOf(k) >= 0, cls);
  // fsecs: [{ title, fields }] = กรอบเพิ่มเติม (เรียงตามลำดับ) ต่อจาก "ข้อมูลตำแหน่ง"
  const secKeys = [].concat.apply([], (cat.fsecs || []).map(s => s.fields));
  const posFields = cat.fields.filter(k => ['frame', 'actual', 'reason'].indexOf(k) < 0 && secKeys.indexOf(k) < 0);
  const hasFrame = cat.fields.indexOf('frame') >= 0;
  const more = cat.noMore ? [] : (cat.fields.indexOf('reason') >= 0 ? ['reason'] : []).concat(B.tailFields); // noMore: ไม่มีหัวข้อ "รายละเอียดเพิ่มเติม" (หมายเหตุเดิมยังอยู่ใน f.data)
  const sh = shortOf(d);
  const curRound = d.round || (defRound() || {}).id;
  const roundOpts = isAdmin() ? B.rounds.slice().reverse() : openRounds().slice().reverse();
  let n = 0;
  return `<form class="card" id="reqForm" novalidate style="--c:${catColor(cat.key)}" onsubmit="return false">
    <div class="formhead"><div class="ic">${icon(cat.icon)}</div>
      <div style="flex:1;min-width:0"><span class="muted" style="font-size:13px">${esc(cat.staff)}${f.id ? ' · ' + esc(f.id) : ''}</span><h2>${esc(cat.name)}</h2></div>
      ${f.id ? '' : `<button type="button" class="btn sm" data-act="change-cat">${icon('swap')} เปลี่ยนประเภท</button>`}</div>
    ${f.id && d.status === 'ส่งกลับแก้ไข' && d.reviewNote ? `<div class="sec"><div class="alert warn">${icon('alert')}<span><b>ข้อเสนอแนะจากเขต:</b> ${esc(d.reviewNote)}</span></div></div>` : ''}
    ${isAdmin() || roundOpts.length > 1 ? `<div class="sec"><h4><span class="n">${++n}</span>รอบการประชุม</h4><div class="grid g2"><div class="field"><label for="f_round">รอบ</label>
      <select class="input" id="f_round" name="round">${roundOpts.map(r => `<option value="${esc(r.id)}" ${String(curRound) === String(r.id) ? 'selected' : ''}>${esc(r.name)}${r.month ? ' · ' + esc(r.month) : ''} · ${esc(roundSt(r))}</option>`).join('')}</select></div></div></div>` : ''}
    <div class="sec"><h4><span class="n">${++n}</span>หน่วยงาน</h4><div class="grid g3">${fld('org')}${fld('unit')}${fld('dept')}</div></div>
    <div class="sec"><h4><span class="n">${++n}</span>ข้อมูลตำแหน่ง</h4><div class="grid g2">${posFields.map(k => fld(k, ['newpos', 'newunit', 'cutpos'].indexOf(k) >= 0 && !(cat.over && cat.over[k]) ? 'spanall' : '')).join('')}</div></div>
    ${(cat.fsecs || []).map(s => `<div class="sec"><h4><span class="n">${++n}</span>${esc(s.title)}</h4><div class="grid ${s.fields.length > 2 ? 'g3' : 'g2'}">${s.fields.map(k => fld(k)).join('')}</div></div>`).join('')}
    ${hasFrame ? `<div class="sec"><h4><span class="n">${++n}</span>อัตรากำลัง</h4><div class="grid g3">${fld('frame')}${fld('actual')}
      <div class="field"><label>ขาด / เกิน (กรอบ-ปฏิบัติงานจริง)</label><div class="shortbox ${gapOf(sh).c}" id="shortBox"><b class="mono">${gapOf(sh).t}</b></div></div></div></div>` : ''}
    ${more.length ? `<div class="sec"><h4><span class="n">${++n}</span>รายละเอียดเพิ่มเติม</h4><div class="grid">${more.map(k => fld(k)).join('')}</div></div>` : ''}
    <div class="formfoot">
      <button type="button" class="btn ghost" data-act="cancel-form">ยกเลิก</button>
      ${f.id ? '' : `<button type="button" class="btn" data-act="save-req" data-more="1">${icon('plus')} บันทึกและเพิ่มต่อ</button>`}
      <button type="button" class="btn primary" data-act="save-req">${icon(f.id ? 'check' : 'send')} ${f.id ? 'บันทึกการแก้ไข' : 'ส่งคำขอ'}</button>
    </div>
  </form>`;
}

function formInput(el) {
  if (!S.form || !el.name) return;
  S.form.data[el.name] = el.value;
  const fe = el.closest('.field');
  if (fe) { el.classList.remove('err'); const m = fe.querySelector('.msg'); if (m) m.hidden = true; }
  if (el.name === 'frame' || el.name === 'actual') {
    const sh = shortOf(S.form.data), box = $('#shortBox');
    if (box) { const g = gapOf(sh); box.className = 'shortbox ' + g.c; box.querySelector('b').textContent = g.t; }
  }
  if (el.name === 'posno') { const h = $('#posnoHint'); if (h) h.innerHTML = posnoHint(el.value); }
}

async function saveReq(btn, addMore) {
  const f = S.form, cat = catOf(f.catKey);
  $$('#reqForm [name]').forEach(el => { f.data[el.name] = el.value; });
  $$('#reqForm .field').forEach(x => { const i = x.querySelector('.input'); if (i) i.classList.remove('err'); const m = x.querySelector('.msg'); if (m) m.hidden = true; });
  let first = null;
  const mark = (k, msg) => {
    const fe = $(`#reqForm [data-f="${k}"]`); if (!fe) return;
    fe.querySelector('.input').classList.add('err');
    const m = fe.querySelector('.msg'); m.textContent = msg; m.hidden = false;
    first = first || fe;
  };
  ['org', 'unit'].concat(cat.required || []).forEach(k => { if (!String(f.data[k] == null ? '' : f.data[k]).trim()) mark(k, 'จำเป็นต้องกรอก'); });
  ['frame', 'actual'].forEach(k => { if (has(f.data[k]) && (isNaN(f.data[k]) || Number(f.data[k]) < 0)) mark(k, 'ต้องเป็นตัวเลข 0 ขึ้นไป'); });
  if (first) {
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    first.querySelector('.input').focus({ preventScroll: true });
    toast('กรุณาตรวจสอบช่องที่มีเครื่องหมาย', 'err');
    return;
  }
  const payload = Object.assign({}, f.data, { catKey: f.catKey, id: f.id || '' });
  await withBtn(btn, async () => {
    try {
      let force = false, res;
      for (;;) {
        res = await api('apiSaveRequest', payload, force);
        if (!res.dup) break;
        const list = res.dup.map(x => `<li><b>${esc(x.id)}</b> · ${esc(x.cat)} · ${esc(x.org)} · ${esc(x.status)}</li>`).join('');
        const ok = await confirmBox(`เลขตำแหน่ง <b>${esc(payload.posno)}</b> มีคำขออยู่แล้วในรอบนี้<ul>${list}</ul>ต้องการบันทึกต่อหรือไม่?`, { title: 'พบเลขตำแหน่งซ้ำ', ok: 'บันทึกต่อ' });
        if (!ok) return;
        force = true;
      }
      upsert(res.item); renderNav();
      toast(f.id ? 'บันทึกการแก้ไข ' + res.item.id + ' แล้ว' : 'ส่งคำขอ ' + res.item.id + ' เรียบร้อย');
      if (addMore) {
        const keep = { org: f.data.org, unit: f.data.unit, dept: f.data.dept, round: f.data.round };
        S.form = { catKey: f.catKey, data: Object.assign({}, cat.defaults || {}, keep) };
        renderView(); window.scrollTo({ top: 0, behavior: 'smooth' });
        const p = $('#f_posno') || $('#f_pos'); if (p) p.focus({ preventScroll: true });
      } else {
        S.form = null; go('list'); openDrawer(res.item.id);
      }
    } catch (e) { fail(e); }
  });
}

const STAB = [['', 'ทั้งหมด'], ['รอพิจารณา', 'รอพิจารณา'], ['ส่งกลับแก้ไข', 'ส่งกลับแก้ไข'], ['ผ่าน', 'เห็นชอบ/อนุมัติ'], ['อื่น', 'ไม่เห็นชอบ/ชะลอ'], ['ถอนเรื่อง', 'ถอนเรื่อง']];
function matchSt(r, s) {
  if (!s) return r.status !== 'ถอนเรื่อง';
  if (s === 'ผ่าน') return r.status === 'เห็นชอบ' || r.status === 'อนุมัติ';
  if (s === 'อื่น') return r.status === 'ไม่เห็นชอบ' || r.status === 'ชะลอ';
  return r.status === s;
}
function filtered(ignoreStatus) {
  const F = S.filters, q = F.q.trim().toLowerCase();
  return scoped().filter(r => (!F.cat || r.catKey === F.cat) && (!F.prov || r.prov === F.prov) && (!F.org || r.org === F.org) &&

    (!q || [r.id, r.posno, r.pos, r.newpos, r.newunit, r.newdept, r.cutpos, r.org, r.unit, r.dept, r.person, r.cond, r.cat].join(' ').toLowerCase().indexOf(q) >= 0));
}

function viewSheets(f, back) {
  let cur = 0;
  const table = s => {
    const bd = s.line ? `2px solid ${s.line}` : '1px solid var(--border)', bdd = s.dline ? `2px solid ${s.dline}` : bd, hw = s.line && !s.bold ? 400 : 700;
    const g = s.cols.some(c => c.group), th = `border:${bd};padding:4px 6px;text-align:center;${s.line ? 'font-weight:400;vertical-align:top' : 'background:var(--surface-2,rgba(127,127,127,.12));vertical-align:middle'}`;
    let h1 = '', h2 = '';
    for (let i = 0; i < s.cols.length; i++) {
      const c = s.cols[i];
      if (g && c.group) { let j = i; while (j + 1 < s.cols.length && s.cols[j + 1].group === c.group) j++;
        h1 += `<th colspan="${j - i + 1}" style="${th}">${esc(c.group)}</th>`; h2 += s.cols.slice(i, j + 1).map(x => `<th style="${th};min-width:${Math.round(x.w * .6)}px">${esc(x.label)}</th>`).join(''); i = j;
      } else h1 += `<th ${g ? 'rowspan="2"' : ''} style="${th};min-width:${Math.round(c.w * .6)}px">${esc(c.label)}</th>`;
    }
    const td = (v, c, last) => `<td style="border:${bdd};padding:4px 6px;vertical-align:top;white-space:pre-line;${c.center ? 'text-align:center;' : ''}${last ? 'font-weight:600;' : ''}">${esc(v)}</td>`;
    const body = s.rows.length ? s.rows.map((r, k) => `<tr>${r.map((v, i) => td(v, s.cols[i], s.total && k === s.rows.length - 1)).join('')}</tr>`).join('')
      : `<tr><td colspan="${s.cols.length}" style="border:${bd};padding:8px;text-align:center" class="muted">ไม่มีคำขอในหมวดนี้</td></tr>`;
    return `<div style="text-align:center;font-weight:${hw};font-size:16px">${esc(s.title)}</div><div style="text-align:center;${s.bold ? 'font-weight:700' : ''}">${esc(s.sub)}</div>
      ${s.sub3 ? `<div style="font-weight:700;margin-top:4px">${esc(s.sub3)}</div>` : ''}
      <div style="overflow:auto;margin-top:10px;max-height:60vh"><table style="border-collapse:collapse;font-size:13px;width:100%"><thead><tr>${h1}</tr>${g ? `<tr>${h2}</tr>` : ''}</thead><tbody>${body}</tbody></table></div>`;
  };
  const render = w => {
    $('#shTabs', w).innerHTML = f.sheets.map((s, i) => `<button class="btn sm ${i === cur ? 'primary' : ''}" data-si="${i}">${esc(s.name)} <span class="muted">${s.total ? '' : s.rows.length}</span></button>`).join('');
    $('#shBody', w).innerHTML = table(f.sheets[cur]);
  };
  modal({ title: f.title, wide: true,
    body: `<div id="shTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div><div id="shBody"></div>`,
    foot: `<button class="btn" id="shBack">กลับ</button><button class="btn primary" id="shX">${icon('download')} ดาวน์โหลด .xlsx</button>`,
    onMount: w => {
      render(w);
      w.addEventListener('click', e => { const b = e.target.closest('[data-si]'); if (b) { cur = +b.dataset.si; render(w); } });

      $('#shX', w).onclick = e => withBtn(e.currentTarget, () => xlsxSheets(f).catch(fail));

/** สร้างไฟล์ .xlsx จากข้อมูลชีต (หน้าตัวอย่าง) — แถว 1–3 หัวเรื่อง · 5–6 หัวตาราง · ข้อมูลเริ่มแถว 7
 *  ใส่รูปแบบตามแบบฟอร์มบัญชีประจำเดือน (ฟอนต์ · เส้นหนาสีส้ม · ความกว้างคอลัมน์) ด้วย xlsx-js-style */
async function xlsxSheets(f) {
  const XLSX = await loadXlsx(), wb = XLSX.utils.book_new();
  const line = c => { const e = c ? { style: 'medium', color: { rgb: c.replace('#', '').toUpperCase() } } : { style: 'thin', color: { rgb: '000000' } };
    return { top: e, bottom: e, left: e, right: e }; };
  f.sheets.forEach(s => {
    const n = s.cols.length, g = s.cols.some(c => c.group), H = g ? 4 : 3, font = { name: s.font || 'TH Sarabun New', sz: 14 };
    const aoa = [[s.title], [s.sub], [s.sub3], []];
    if (g) { aoa.push(s.cols.map(c => c.group || c.label)); aoa.push(s.cols.map(c => c.group ? c.label : '')); }
    else aoa.push(s.cols.map(c => c.label));
    const D = aoa.length, rows = s.rows.length ? s.rows : [s.cols.map(() => '')];
    const ws = XLSX.utils.aoa_to_sheet(aoa.concat(rows));
    const cell = (r, c) => { const a = XLSX.utils.encode_cell({ r, c }); return ws[a] || (ws[a] = { t: 's', v: '' }); };
    cell(0, 0).s = { font: Object.assign({}, font, { sz: 16, bold: !!s.bold }), alignment: { horizontal: 'center', vertical: 'top', wrapText: true } };
    cell(1, 0).s = { font: Object.assign({}, font, { sz: 16, bold: !!s.bold }), alignment: { horizontal: 'center', vertical: 'top' } };
    cell(2, 0).s = { font, alignment: { vertical: 'top' } };
    for (let r = H; r < D; r++) for (let c = 0; c < n; c++)
      cell(r, c).s = { font: Object.assign({}, font, { bold: !s.line }), border: line(s.line), alignment: { horizontal: 'center', vertical: 'top', wrapText: true } };
    rows.forEach((row, k) => { for (let c = 0; c < n; c++)
      cell(D + k, c).s = { font: Object.assign({}, font, { bold: !!(s.total && k === rows.length - 1) }), border: line(s.dline || s.line),
        alignment: { horizontal: s.cols[c].center ? 'center' : undefined, vertical: 'top', wrapText: true } }; });
    const m = [0, 1, 2].map(r => ({ s: { r, c: 0 }, e: { r, c: n - 1 } }));
    if (g) for (let i = 0; i < n; i++) {
      if (s.cols[i].group) { let j = i; while (j + 1 < n && s.cols[j + 1].group === s.cols[i].group) j++; if (j > i) m.push({ s: { r: H, c: i }, e: { r: H, c: j } }); i = j; }
      else m.push({ s: { r: H, c: i }, e: { r: H + 1, c: i } });
    }
    ws['!merges'] = m;
    ws['!cols'] = s.cols.map(c => ({ width: c.wch || Math.max(6, Math.round(c.w / 7)) }));  // width = หน่วยความกว้างแบบ Excel ตรงกับแบบฟอร์ม
    ws['!rows'] = [{ hpt: 24 }, { hpt: 24 }, { hpt: 21 }, { hpt: 12 }, { hpt: 22.5 }, { hpt: 22.5 }];
    ws['!margins'] = { left: 0.39, right: 0.24, top: 0.35, bottom: 0.35, header: 0.31, footer: 0.31 };
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31).replace(/[\\/?*\[\]:]/g, '-'));
  });
  await download(f.title.replace(/[\\/?*:"<>|]/g, '-') + '.xlsx', new Uint8Array(XLSX.write(wb, { bookType: 'xlsx', type: 'array' })),
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ───────────── import (.xlsx) ───────────── */
let xlsxLib = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLib || (xlsxLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';  // SheetJS ที่เขียนรูปแบบเซลล์ (ฟอนต์/เส้น) ลง .xlsx ได้
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxLib = null; rej(new Error('โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')); };
    document.head.appendChild(s);
  }));
}

/** หัวคอลัมน์ในบัญชีเดิม → ช่องข้อมูล (ตรวจตามลำดับ — กฎที่เจาะจงกว่าอยู่ก่อน) */
const IMPORT_HEADS = [
  ['#', /^ลำดับ/], ['org', /สังกัด/], ['newunit', /ส่วนราชการใหม่|หน่วยงานใหม่|ปลายทาง|ย้ายไป|^หน่วยงาน$/], ['unit', /ส่วนราชการ/], ['posno', /เลขที่/],
  ['newdept', /^กลุ่มงาน/], ['cutpos', /^ตัดโอนตำแหน่ง$/], ['newpos', /ตำแหน่งใหม่|ขอปรับปรุง|ที่ขออนุมัติกำหนด|ชื่อสายงาน\s*\(?ใหม่/], ['pos', /ชื่อสายงาน|ชื่อตำแหน่ง/], ['level', /^ระดับ/],
  ['exec', /บริหาร/], ['cond', /เงื่อนไข/], ['person', /ผู้ที่จะมา|ผู้ขอย้าย|ชื่อ-?สกุล/], ['type', /ประเภทการจ้าง/], ['frame', /กรอบ/],
  ['actual', /ปฏิบัติ/], ['short', /^ขาด/], ['reason', /เหตุผล/], ['result', /ผลการพิจารณา/], ['note', /หมายเหตุ/]
];
const normSheet = s => String(s || '').replace(/[\s.()]/g, '');
const cellTxt = v => String(v == null ? '' : v).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n');

/** อ่านสมุดงาน → { sheets:[{name, cat, rows, skip}], rows:[...], roundHint } */
function parseBook(XLSX, wb) {
  const B = S.boot, hints = {}, out = { sheets: [], rows: [] };
  const conds = B.lists.CONDS.concat(B.lists.GOV_CONDS || []).map(normSheet);
  wb.SheetNames.forEach((name, si) => {
    const meta = wb.Workbook && wb.Workbook.Sheets && wb.Workbook.Sheets[si];
    if (meta && meta.Hidden) return;
    const n = normSheet(name);
    const cat = B.cats.find(c => normSheet(c.sheet) === n || (c.alias || []).some(a => normSheet(a) === n));
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: true, blankrows: true });
    const title = grid.slice(0, 3).map(r => r.join(' ')).join(' ');
    const m = title.match(/ครั้งที่\s*(\d+\s*\/\s*\d{4})/);
    if (m) { const k = m[1].replace(/\s/g, ''); hints[k] = (hints[k] || 0) + 1; }
    const h = grid.findIndex(r => r.some(c => /^ลำดับ/.test(normSheet(c))));
    const info = { name: name.trim(), cat: cat || null, rows: 0 };
    out.sheets.push(info);
    if (h < 0) return;
    // หัวตาราง 2 แถว: แถวบน + แถวล่าง (ถ้าแถวล่างไม่ใช่ข้อมูล)
    const top = grid[h], sub = grid[h + 1] || [];
    const iNo = top.findIndex(c => /^ลำดับ/.test(normSheet(c)));
    const subIsHead = !/^\d+$/.test(String(sub[iNo]).trim());
    const col = {};
    let typeSeen = 0;
    top.forEach((_, i) => {
      if (i === iNo) return;
      const lab = normSheet(top[i]) + (subIsHead ? normSheet(sub[i]) : '');
      const rule = IMPORT_HEADS.find(r => r[1].test(lab) || r[1].test(normSheet(subIsHead ? sub[i] : '')));
      if (!rule) return;
      let k = rule[0];
      if (k === 'type') k = typeSeen++ ? 'typenew' : 'typeold';
      if (!(k in col)) col[k] = i;
    });
    if (!('org' in col) && Object.values(col).indexOf(iNo + 1) < 0) col.org = iNo + 1; // บางชีตหัว "สังกัด" หาย
    const start = h + (subIsHead ? 2 : 1);
    for (let r = start; r < grid.length; r++) {
      const row = grid[r], get = k => (k in col ? cellTxt(row[col[k]]) : '');
      if (!cat) { if (/^\d+$/.test(cellTxt(row[iNo]))) info.rows++; continue; }
      const d = { org: get('org'), posno: get('posno'), pos: get('pos') };
      if (!d.pos && !d.posno) continue;
      info.rows++;
      ['unit', 'level', 'exec', 'newpos', 'newunit', 'cutpos', 'newdept', 'cond', 'person', 'typeold', 'typenew', 'reason', 'note', 'result']
        .forEach(k => { d[k] = get(k); });
      ['frame', 'actual'].forEach(k => { const v = String(row[col[k]] == null ? '' : row[col[k]]).replace(/[^\d.]/g, ''); d[k] = k in col && v !== '' ? Math.round(Number(v)) : ''; });
      d.org = d.org.replace(/\s+/g, ' ');
      // พรก: ช่อง "ตำแหน่งใหม่" มักเป็นเงื่อนไข เช่น บรรจุผู้ได้รับคัดเลือก
      if (cat.fields.indexOf('cond') >= 0 && !d.cond && conds.indexOf(normSheet(d.newpos)) >= 0) { d.cond = d.newpos; d.newpos = ''; }
      d.catKey = cat.key;
      d.ref = info.name + ' ลำดับ ' + (cellTxt(row[iNo]) || (r + 1));
      d.orgOk = B.orgs.some(o => o.org === d.org);
      out.rows.push(d);
    }
  });
  const best = Object.keys(hints).sort((a, b) => hints[b] - hints[a])[0];
  out.roundHint = best || '';
  return out;
}

function importModal() {

    body: `<p class="muted" style="margin:0">เลือกไฟล์ .xlsx รูปแบบเดียวกับบัญชีประจำเดือน — ระบบจับคู่ชื่อชีตกับประเภทคำขอ และหัวคอลัมน์กับช่องข้อมูลให้อัตโนมัติ ตรวจสรุปก่อนกดนำเข้า</p>

        <div class="field"><label for="impSt">สถานะเริ่มต้น</label><select class="input" id="impSt">${B.statuses.filter(s => s.key !== 'ถอนเรื่อง').map(s => `<option>${esc(s.key)}</option>`).join('')}</select></div>
      </div>
      <div id="impSum"></div>`,
    foot: `<button class="btn" data-act="modal-close">ยกเลิก</button><button class="btn primary" id="impOk" disabled>${icon('upload')} นำเข้า</button>`,
    onMount: w => {
      const sum = $('#impSum', w), ok = $('#impOk', w);
      $('#impFile', w).onchange = async e => {
        const f = e.target.files[0]; parsed = null; ok.disabled = true;
        if (!f) { sum.innerHTML = ''; return; }
        sum.innerHTML = `<div class="row muted"><span class="spin"></span> กำลังอ่านไฟล์…</div>`;
        busy(1);
        try {
          const XLSX = await loadXlsx();
          parsed = parseBook(XLSX, XLSX.read(await f.arrayBuffer(), { type: 'array' }));
        } catch (err) { sum.innerHTML = `<div class="alert">${icon('alert')}<span>อ่านไฟล์ไม่ได้: ${esc(err.message || err)}</span></div>`; return; } finally { busy(-1); }
        if (parsed.roundHint) {
          const rd = B.rounds.find(r => normSheet(r.name).indexOf(parsed.roundHint.replace(/\s/g, '')) >= 0);
          if (rd) $('#impRound', w).value = rd.id;
        }
        renderImportSummary(sum, parsed);
        ok.disabled = !parsed.rows.some(r => r.orgOk);
      };
      ok.onclick = () => withBtn(ok, async () => {
        const good = parsed.rows.filter(r => r.orgOk).map(r => { const o = Object.assign({}, r); delete o.orgOk; return o; });
        const rid = $('#impRound', w).value, rd = roundOf(rid);
        try {
          const res = await api('apiImportRequests', rid, good, $('#impSt', w).value);
          res.added.forEach(upsert);
          S.round = String(rid); renderRoundPick(); renderNav(); renderView();
          const bad = parsed.rows.filter(r => !r.orgOk).map(r => r.ref + ': ไม่พบหน่วยงาน "' + r.org + '"').concat(res.errors);
          modal({ title: 'นำเข้าเรียบร้อย',

              ${res.skipped.length ? `<div class="alert warn">${icon('alert')}<span>ข้าม ${res.skipped.length} รายการที่มีอยู่แล้วในรอบนี้ (ซ้ำ)<br><span style="font-size:13px">${res.skipped.map(esc).join(' · ')}</span></span></div>` : ''}
              ${bad.length ? `<div class="alert">${icon('alert')}<span>ไม่ได้นำเข้า ${bad.length} รายการ<br><span style="font-size:13px">${bad.map(esc).join('<br>')}</span></span></div>` : ''}`,

    } });

function renderImportSummary(el, p) {
  const lines = p.sheets.filter(s => s.rows || s.cat).map(s =>
    `<tr><td>${esc(s.name)}</td><td>${s.cat ? catTag({ catKey: s.cat.key, cat: s.cat.name }) : `<span class="chip t-warn nodot">ไม่มีประเภทคำขอที่ตรงกัน — ข้าม</span>`}</td><td class="mono" style="text-align:right">${s.rows}</td></tr>`).join('');
  const bad = p.rows.filter(r => !r.orgOk);
  const badOrgs = Array.from(new Set(bad.map(r => r.org || '(ว่าง)')));
  const total = p.rows.length - bad.length;
  el.innerHTML = `${p.roundHint ? `<div class="alert info">${icon('calendar')}<span>ไฟล์นี้ระบุ <b>ครั้งที่ ${esc(p.roundHint)}</b></span></div>` : ''}
    <div class="tbl-wrap" style="border:1px solid var(--border);border-radius:10px"><table class="tbl imp"><thead><tr><th>ชีตในไฟล์</th><th>นำเข้าเป็น</th><th style="text-align:right">รายการ</th></tr></thead><tbody>${lines}</tbody></table></div>
    ${bad.length ? `<div class="alert warn">${icon('alert')}<span>${bad.length} รายการจะไม่ถูกนำเข้า เพราะไม่พบสังกัดในรายชื่อหน่วยงาน: <b>${badOrgs.map(esc).join(', ')}</b><br><span style="font-size:13px">เพิ่มหน่วยงานที่ ตั้งค่า → หน่วยงาน แล้วเลือกไฟล์ใหม่</span></span></div>` : ''}
    <div class="row"><b>พร้อมนำเข้า ${total} รายการ</b><span class="muted" style="font-size:13px">· รายการที่มีอยู่แล้วในรอบ (ซ้ำ) จะถูกข้าม</span></div>`;
}

/* ───────────── drawer ───────────── */
function closeDrawer() { $$('.drawer,.scrim').forEach(e => e.remove()); }

function openDrawer(id) {
  const r = S.reqs.find(x => x.id === id); if (!r) return;
  closeDrawer();
  const c = catOf(r.catKey) || { fields: [], name: r.cat, icon: 'inbox', labels: {} };
  const B = S.boot, rd = roundOf(r.round);
  const keys = B.headFields.concat(c.fields, B.tailFields);
  let dl = '';
  keys.forEach(k => {
    if (has(r[k])) {
      const v = esc(r[k]);
      dl += `<dt>${esc(labelOf(c, k))}</dt><dd>${v}</dd>`;
    }
    if (k === 'actual' && has(r.short)) { const g = gapOf(r.short); dl += `<dt>ขาด / เกิน (กรอบ-ปฏิบัติงานจริง)</dt><dd><b style="color:${g.c === 'pos' ? 'var(--bad)' : g.c === 'over' ? 'var(--warn)' : 'var(--ok)'}">${g.t}</b></dd>`; }
  });
  const tl = [`<li><b>ส่งคำขอ</b><small>${fmtDT(r.createdAt)} · ${esc(r.createdBy)}</small></li>`];
  if (r.updatedAt && r.updatedAt !== r.createdAt) tl.push(`<li><b>แก้ไขล่าสุด</b><small>${fmtDT(r.updatedAt)} · ${esc(r.updatedBy)}</small></li>`);
  if (r.reviewedAt) tl.push(`<li><b>เขตพิจารณา: ${esc(r.status)}</b><small>${fmtDT(r.reviewedAt)} · ${esc(r.reviewedBy)}</small></li>`);

  const acts = [];
  if (canEdit(r)) acts.push(`<button class="btn primary" data-act="edit-req" data-id="${esc(r.id)}">${icon('edit')} แก้ไข</button>`);
  if (canEdit(r) && !isAdmin()) acts.push(`<button class="btn" data-act="withdraw-req" data-id="${esc(r.id)}">${icon('undo')} ถอนเรื่อง</button>`);
  if (isAdmin()) acts.push(`<span class="spacer"></span><button class="btn danger" data-act="delete-req" data-id="${esc(r.id)}">${icon('trash')} ลบ</button>`);
  if (!acts.length) acts.push(`<span class="muted" style="font-size:14px">${r.status === 'ถอนเรื่อง' ? 'ถอนเรื่องแล้ว' : 'เขตพิจารณาแล้ว หรือรอบนี้ปิดรับ — แก้ไขไม่ได้'}</span>`);

  const html = `<div class="scrim" data-act="drawer-close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="รายละเอียดคำขอ ${esc(r.id)}">
    <div class="drawer-h"><div style="flex:1;min-width:0">${catTag(r)}
      <h2>${r.posno ? esc(r.posno) + ' · ' : ''}${esc(r.pos)}</h2>
      <div class="row">${chip(r.status)}<span class="muted mono">${esc(r.id)}</span>${rd ? `<span class="muted">· ${esc(rd.name)}</span>` : ''}</div></div>
      <button class="btn ghost icon" data-act="drawer-close" aria-label="ปิด">${icon('x')}</button></div>
    <div class="drawer-b">
      ${r.reviewNote ? `<div class="alert ${r.status === 'ส่งกลับแก้ไข' ? 'warn' : 'info'}">${icon('alert')}<span><b>ข้อเสนอแนะจากเขต:</b> ${esc(r.reviewNote)}</span></div>` : ''}
      ${r.result && !isAdmin() ? `<div class="panel"><h4>${icon('check')} ผลการพิจารณาเขต</h4><div>${esc(r.result)}</div></div>` : ''}
      <dl class="dl">${dl}</dl>
      ${isAdmin() ? reviewPanel(r) : ''}
      <div><h4 style="margin:0 0 12px">ประวัติ</h4><ul class="timeline">${tl.join('')}</ul></div>
    </div>
    <div class="drawer-f">${acts.join('')}</div>
  </aside>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const btn = $('.drawer .drawer-h .btn'); if (btn) btn.focus();

      <td>${esc(u.org || u.prov || 'ทั้งเขต')}</td>
      <td>${u.active ? '<span class="chip t-ok">ใช้งาน</span>' : '<span class="chip t-mute">ปิดใช้งาน</span>'}${u.noPassword ? ' <span class="chip nodot t-bad">ยังไม่มีรหัสผ่าน — กด 🔑</span>' : u.mustChange ? ' <span class="chip nodot t-warn">รอเปลี่ยนรหัส</span>' : ''}</td>
      <td class="sub">${u.lastLogin ? ago(u.lastLogin) : 'ยังไม่เคย'}</td>
      <td style="white-space:nowrap"><button class="btn sm ghost icon" data-act="user-reset" data-u="${esc(u.username)}" title="ตั้งรหัสผ่าน" aria-label="ตั้งรหัสผ่าน ${esc(u.username)}">${icon('key')}</button>${u.username === S.boot.user.username ? '' : `<button class="btn sm ghost icon" style="color:var(--bad)" data-act="user-del" data-u="${esc(u.username)}" title="ลบผู้ใช้" aria-label="ลบผู้ใช้ ${esc(u.username)}">${icon('trash')}</button>`}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function orgOptions(sel) {
  const P = S.boot.provinces, opt = o => `<option value="${esc(o.org)}" ${o.org === sel ? 'selected' : ''}>${esc(o.org)}</option>`;
  const groups = P.map(p => {
    const os = S.boot.orgs.filter(o => o.prov === p);
    return os.length ? `<optgroup label="${esc(p)}">${os.map(opt).join('')}</optgroup>` : '';
  }).join('');
  // หน่วยงานที่จังหวัดว่าง/สะกดไม่ตรง ยังต้องเลือกได้ (ไม่งั้นจะหายจากรายการเงียบ ๆ)
  const rest = S.boot.orgs.filter(o => P.indexOf(o.prov) < 0);
  return groups + (rest.length ? `<optgroup label="ไม่ระบุจังหวัด">${rest.map(opt).join('')}</optgroup>` : '');
}

function userModal(u) {

    title: isNew ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้ ' + u.username, wide: true,

      <div class="field"><label for="uU">ชื่อผู้ใช้ <span class="req">*</span></label><input class="input mono" id="uU" value="${esc(u.username || '')}" ${isNew ? '' : 'readonly'} placeholder="เช่น nkp.hr" autocapitalize="none" spellcheck="false"><span class="hint">ภาษาอังกฤษพิมพ์เล็ก ตัวเลข . _ - ยาว 3–30 ตัว</span></div>
      <div class="field"><label for="uN">ชื่อ-สกุล</label><input class="input" id="uN" value="${esc(u.name || '')}"></div>
      <div class="field"><label for="uR">บทบาท</label><select class="input" id="uR">${Object.keys(S.boot.roles).map(k => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${esc(S.boot.roles[k])}</option>`).join('')}</select>
        <span class="hint" id="uRh"></span></div>
      <div class="field" id="uPF"><label for="uP">จังหวัด</label><select class="input" id="uP"><option value="">— เลือก —</option>${S.boot.provinces.map(p => `<option ${u.prov === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="field" id="uOF"><label for="uO">หน่วยงาน</label><select class="input" id="uO"><option value="">— เลือก —</option>${orgOptions(u.org)}</select></div>
      <div class="field"><label for="uE">อีเมล</label><input class="input" id="uE" type="email" value="${esc(u.email || '')}"></div>
      <div class="field"><label for="uT">โทรศัพท์</label><input class="input" id="uT" value="${esc(u.phone || '')}"></div>
      <div class="field" style="justify-content:flex-end"><label class="toggle"><input type="checkbox" id="uA" ${u.active ? 'checked' : ''}> เปิดใช้งาน</label></div>
      ${isNew ? pwFields() : ''}
    </div>`,
    foot: `<button class="btn" data-act="modal-close">ยกเลิก</button><button class="btn primary" id="uOk">${icon('check')} ${isNew ? 'สร้างผู้ใช้' : 'บันทึก'}</button>`,
    onMount: w => {
      const hints = { admin: 'เห็นและพิจารณาคำขอทุกหน่วยงาน จัดการผู้ใช้ รอบ และหน่วยงาน', prov: 'เห็นและส่งคำขอแทนทุกหน่วยงานในจังหวัด', unit: 'เห็นและส่งคำขอของหน่วยงานตนเอง และเลือกส่งแทนหน่วยงานอื่นในจังหวัดเดียวกันได้' };
      const sync = () => { const r = $('#uR', w).value; $('#uPF', w).hidden = r !== 'prov'; $('#uOF', w).hidden = r !== 'unit'; $('#uRh', w).textContent = hints[r]; };
      $('#uR', w).onchange = sync; sync();
      $('#uOk', w).onclick = e => withBtn(e.currentTarget, async () => {
        const data = { username: $('#uU', w).value.trim().toLowerCase(), name: $('#uN', w).value, role: $('#uR', w).value, prov: $('#uP', w).value,
          org: $('#uO', w).value, email: $('#uE', w).value, phone: $('#uT', w).value, active: $('#uA', w).checked };
        const bad = (sel, msg) => { toast(msg, 'err'); const el = $(sel, w); el.classList.add('err'); el.focus(); el.addEventListener('input', () => el.classList.remove('err'), { once: true }); };
        if (isNew && !/^[a-z0-9._-]{3,30}$/.test(data.username)) {
          return bad('#uU', /[^\x00-\x7f]/.test(data.username) ? 'ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษ (ตั้งชื่อภาษาไทยได้ที่ช่อง ชื่อ-สกุล)'
            : /\s/.test(data.username) ? 'ชื่อผู้ใช้ห้ามมีช่องว่าง — ใช้ . หรือ _ แทน เช่น nkp.hr'
            : 'ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - ยาว 3–30 ตัว');
        }
        if (data.role === 'prov' && !data.prov) return bad('#uP', 'กรุณาเลือกจังหวัด');
        if (data.role === 'unit' && !data.org) return bad('#uO', 'กรุณาเลือกหน่วยงาน');
        if (isNew) {
          const m = pwProblem(w);
          if (m) return bad(m[0], m[1]);
          data.password = $('#nP', w).value;
        }
        try {
          const res = await api('apiSaveUser', data, isNew);
          const i = S.users.findIndex(x => x.username === res.user.username);
          if (i >= 0) S.users[i] = res.user; else S.users.push(res.user);
          refreshSettings();
          if (isNew) secretModal('สร้างผู้ใช้เรียบร้อย', res.user.username, data.password); else { closeModal(); toast('บันทึกผู้ใช้แล้ว'); }
        } catch (err) { fail(err); }
      });
    }
  });
}

/** ช่องรหัสผ่าน + ยืนยัน (ผู้ดูแลกำหนดเอง) — ใช้ในฟอร์มเพิ่มผู้ใช้และปุ่ม 🔑 */
function pwFields() {
  return `<div class="field"><label for="nP">รหัสผ่าน <span class="req">*</span></label>
      <div class="input-wrap pw-wrap">${icon('key')}<input class="input mono" id="nP" type="password" autocomplete="new-password">
      <button type="button" class="btn ghost sm icon" data-act="pw-toggle" data-for="nP" aria-label="แสดงรหัสผ่าน">${icon('eye')}</button></div>
      <span class="hint">อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข</span></div>
    <div class="field"><label for="nC">ยืนยันรหัสผ่าน <span class="req">*</span></label><input class="input mono" id="nC" type="password" autocomplete="new-password"></div>`;
}

/** [selector, ข้อความ] ถ้ารหัสใน pwFields ใช้ไม่ได้ · null ถ้าผ่าน */
function pwProblem(w) {
  const n = $('#nP', w).value;
  if (n.length < 8 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) return ['#nP', 'รหัสผ่านต้องยาว 8 ตัวขึ้นไป มีทั้งตัวอักษรและตัวเลข'];
  if (n !== $('#nC', w).value) return ['#nC', 'รหัสผ่านทั้งสองช่องไม่ตรงกัน'];
  return null;
}

function setPwModal(un) {
  modal({ title: 'ตั้งรหัสผ่าน ' + un,
    body: `<p class="muted" style="margin:0">รหัสเดิมจะใช้ไม่ได้ทันที — ผู้ใช้เข้าระบบด้วยรหัสนี้ได้เลย</p>${pwFields()}`,
    foot: `<button class="btn" data-act="modal-close">ยกเลิก</button><button class="btn primary" id="spOk">${icon('check')} บันทึกรหัสผ่าน</button>`,
    onMount: w => {
      $('#nP', w).focus();
      $('#spOk', w).onclick = e => withBtn(e.currentTarget, async () => {
        const m = pwProblem(w);
        if (m) { toast(m[1], 'err'); $(m[0], w).focus(); return; }
        const pw = $('#nP', w).value;
        try {
          await api('apiResetPassword', un, pw);
          const u = S.users.find(x => x.username === un); if (u) { u.mustChange = false; u.noPassword = false; }
          refreshSettings(); secretModal('ตั้งรหัสผ่านแล้ว', un, pw);
        } catch (err) { fail(err); }
      });
    } });
}

  const text = `ระบบคำขอใช้ตำแหน่งว่าง เขตสุขภาพที่ 1\n${S.boot.url ? 'ลิงก์: ' + S.boot.url + '\n' : ''}ชื่อผู้ใช้: ${username}\nรหัสผ่าน: ${pw}`;

    body: `<p style="margin:0">ส่งข้อมูลนี้ให้ผู้ใช้ <b>${esc(username)}</b></p>

}

function changePwModal(forced) {
  modal({ title: forced ? 'ตั้งรหัสผ่านใหม่ก่อนใช้งาน' : 'เปลี่ยนรหัสผ่าน', locked: forced,

      <div class="field"><label for="pN">รหัสผ่านใหม่</label><input class="input" id="pN" type="password" autocomplete="new-password"><span class="hint">อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข</span></div>

      });
    } });
