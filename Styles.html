<style>
:root{
  --bg:#f2f7fb; --surface:#ffffff; --surface-alt:#eef5fb; --border:#d6e3ee; --border-strong:#b9cddd;
  --ink:#0f2233; --ink-2:#3d5366; --muted:#6b8193;
  --accent:#0a6ab4; --accent-strong:#08538e; --accent-soft:#deedf9; --on-accent:#ffffff;
  --brand:#1d7a45; --brand-strong:#145e34; --brand-soft:#e3f2e8;
  --ok:#1d7a45; --ok-soft:#e3f2e8; --warn:#b45309; --warn-soft:#fdf0dc; --bad:#c0262d; --bad-soft:#fde7e8;
  --wait:#0a6ab4; --wait-soft:#deedf9; --hold:#6d3fc0; --hold-soft:#efe7fb; --mute:#64748b; --mute-soft:#eef1f5;
  --shadow:0 1px 2px rgba(15,34,51,.06),0 4px 16px rgba(15,34,51,.06);
  --shadow-lg:0 12px 40px rgba(15,34,51,.18);
  --radius:14px; --radius-sm:10px; --btn-border:4px;
  /* โทน น้ำเงิน · เขียว · ดำ: แถบเมนูและการ์ดเด่นใช้พื้นดำ */
  --black:#0b1118; --side-bg:#0b1118; --side-ink:#eef3f7; --side-muted:#93a3b1; --side-hover:rgba(255,255,255,.07);
  --side-on-bg:rgba(47,164,99,.18); --side-on:#6fe0a0; --brand-bright:#2fa463;
  --font:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif; --font-head:'Sarabun','Noto Sans Thai',sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d1620; --surface:#13202c; --surface-alt:#182837; --border:#273b4e; --border-strong:#36506a;
  --ink:#e6eef5; --ink-2:#b4c4d2; --muted:#8aa0b3;
  --accent:#5ab3f2; --accent-strong:#8bcaf6; --accent-soft:#122d44; --on-accent:#07141f;
  --brand:#5ccf88; --brand-strong:#86e0a8; --brand-soft:#153322;
  --ok:#5ccf88; --ok-soft:#153322; --warn:#f2b45a; --warn-soft:#3a2a12; --bad:#f2787d; --bad-soft:#3d1a1d;
  --wait:#5ab3f2; --wait-soft:#122d44; --hold:#b79af0; --hold-soft:#2a2045; --mute:#94a3b8; --mute-soft:#1e2a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark; --black:#05080c; --side-bg:#070b10; --side-ink:#e6eef5; --side-muted:#8aa0b3; --side-hover:rgba(255,255,255,.06);
}}
:root[data-theme="dark"]{
  --bg:#0d1620; --surface:#13202c; --surface-alt:#182837; --border:#273b4e; --border-strong:#36506a;
  --ink:#e6eef5; --ink-2:#b4c4d2; --muted:#8aa0b3;
  --accent:#5ab3f2; --accent-strong:#8bcaf6; --accent-soft:#122d44; --on-accent:#07141f;
  --brand:#5ccf88; --brand-strong:#86e0a8; --brand-soft:#153322;
  --ok:#5ccf88; --ok-soft:#153322; --warn:#f2b45a; --warn-soft:#3a2a12; --bad:#f2787d; --bad-soft:#3d1a1d;
  --wait:#5ab3f2; --wait-soft:#122d44; --hold:#b79af0; --hold-soft:#2a2045; --mute:#94a3b8; --mute-soft:#1e2a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark; --black:#05080c; --side-bg:#070b10; --side-ink:#e6eef5; --side-muted:#8aa0b3; --side-hover:rgba(255,255,255,.06);
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.25}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none!important}
.mobile-only{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── progress bar ── */
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s}
#busy.on{opacity:1}
#busy::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,var(--brand),var(--accent));animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:10px;border:var(--btn-border) solid var(--muted);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2);background:var(--surface-alt)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.input:focus-visible,.nav a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--ink)}
.btn.brand{background:var(--brand);border-color:var(--brand-strong);color:#fff}
.btn.brand:hover{background:var(--brand-strong)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-alt)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:32px;padding:2px 10px;font-size:14px;border-radius:8px}
.btn.icon{padding:0;width:40px}
.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── form ── */
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:84px;resize:vertical}
.input:hover{border-color:var(--border-strong)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input.err{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-weight:600;font-size:14px;color:var(--ink-2)}
.field>label .req{color:var(--bad);margin-left:2px}
.field .hint{font-size:13px;color:var(--muted)}
.field .msg{font-size:13px;color:var(--bad)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2} .spanall{grid-column:1/-1}
.input-wrap{position:relative}
.input-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input-wrap .input{padding-left:38px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--border-strong);position:relative;cursor:pointer;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--brand)} .toggle input:checked::after{transform:translateX(18px)}

/* ── login ── */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(1200px 600px at 10% -10%,#2fa463 0,transparent 55%),radial-gradient(900px 700px at 110% 110%,#0a6ab4 0,transparent 55%),linear-gradient(135deg,#145e34,#08538e)}
.login-art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.login-art>*{position:relative}
.login-art h1{font-size:40px;font-weight:700;margin:12px 0 10px}
.login-art p{opacity:.88;max-width:440px;margin:0}
.feat{display:grid;gap:14px;margin-top:36px;max-width:440px}
.feat div{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:12px 14px;border-radius:12px}
.feat .ico{width:20px;height:20px;margin-top:2px}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-card{width:100%;max-width:400px}
.login-card h2{font-size:28px;margin-bottom:6px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.logo .ico{width:26px;height:26px}
.pw-wrap{position:relative} .pw-wrap .btn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.alert.info{background:var(--accent-soft);color:var(--accent-strong)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert .ico{margin-top:2px}

/* ── shell ── */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--border)}
.brandbox{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}
.brandbox .mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--accent));box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 35%,transparent)}
.brandbox .mark .ico{width:22px;height:22px}
.brandbox b{display:block;font-family:var(--font-head);font-size:16px;line-height:1.2}
.brandbox small{color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;cursor:pointer;position:relative}
.nav a:hover{background:var(--surface-alt);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav .badge{margin-left:auto}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-alt)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--brand));flex:none}
.me b{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me>div:not(.avatar){min-width:0;flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--border)}
.top h1{font-size:22px;flex:1;min-width:0}
.round-pick{display:flex;align-items:center;gap:8px}
.round-pick select{min-width:220px}
.content{padding:8px 28px 40px;max-width:1280px;width:100%}
.bottomnav{display:none}

/* ── cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:17px;flex:1}
.card-b{padding:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.welcome{padding:26px;color:#fff;border:none;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--brand-strong),var(--brand) 45%,var(--accent))}
.welcome::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.welcome h2{font-size:26px;margin-bottom:6px}
.welcome p{margin:0 0 18px;opacity:.9}
.welcome .btn{background:#fff;color:var(--brand-strong);border-color:#fff}
.welcome .btn.glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.roundcard{padding:22px;display:flex;flex-direction:column;gap:12px}
.roundcard .big{font-family:var(--font-head);font-size:22px;font-weight:700}
.countdown{display:flex;align-items:baseline;gap:6px}
.countdown b{font-size:34px;font-family:var(--font-head);color:var(--accent);line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .ic .ico{width:22px;height:22px}
.kpi b{display:block;font-size:28px;font-family:var(--font-head);line-height:1.1}
.kpi small{color:var(--muted);font-size:13px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14px;cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px}
.bar:hover{background:var(--surface-alt)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;border-radius:99px;background:var(--surface-alt);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}

.feed{display:flex;flex-direction:column}
.feed-i{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.feed-i:last-child{border-bottom:none}
.feed-i:hover b{color:var(--accent)}
.feed-i .t{flex:1;min-width:0}
.feed-i b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-i small{color:var(--muted);font-size:13px}

/* ── chips ── */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--mute-soft);color:var(--mute)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.t-wait{background:var(--wait-soft);color:var(--wait)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.t-hold{background:var(--hold-soft);color:var(--hold)} .t-mute{background:var(--mute-soft);color:var(--mute)}
.cattag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.cattag i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.cattag i .ico{width:13px;height:13px}

/* ── category picker ── */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.catcard{text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--radius);border:4px solid color-mix(in srgb,var(--c) 40%,var(--border));background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.catcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--c)}
.catcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.catcard .ic .ico{width:22px;height:22px}
.catcard b{font-size:16px;font-family:var(--font-head)}
.catcard p{margin:0;font-size:14px;color:var(--muted)}
.catcard .staff{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.02em}

/* ── request form ── */
.formhead{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border)}
.formhead .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.formhead .ic .ico{width:24px;height:24px}
.formhead h2{font-size:20px}
.sec{padding:20px;border-bottom:1px solid var(--border)}
.sec:last-of-type{border-bottom:none}
.sec h4{margin:0 0 14px;font-size:14px;letter-spacing:.03em;color:var(--brand);display:flex;align-items:center;gap:8px}
.sec h4 .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:12px}
.shortbox{display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:12px;background:var(--surface-alt);padding:8px;min-height:68px}
.shortbox b{font-size:26px;font-family:var(--font-head);line-height:1}
.shortbox small{color:var(--muted);font-size:12px}
.shortbox.pos b{color:var(--bad)} .shortbox.over b{color:var(--warn)} .shortbox.zero b{color:var(--ok)}
.formfoot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius)}

/* ── list ── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.toolbar .input-wrap{flex:1 1 260px}
.toolbar select.input{width:auto;min-width:150px;flex:0 1 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
.tab{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;border:var(--btn-border) solid var(--muted);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.tab:hover{border-color:var(--border-strong)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab .n{font-size:12px;padding:0 7px;border-radius:99px;background:var(--surface-alt);color:var(--ink-2)}
.tab.on .n{background:color-mix(in srgb,var(--surface) 22%,transparent);color:var(--surface)}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{position:sticky;top:0;text-align:left;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-alt)}
.tbl tbody tr.sel{background:var(--accent-soft)}
.tbl .id{font-weight:700;color:var(--accent);white-space:nowrap}
.tbl .sub{display:block;color:var(--muted);font-size:13px}
.tbl .pos b{display:block}
.tbl .arrow{display:flex;gap:6px;align-items:flex-start;color:var(--ink-2);font-size:13px;margin-top:2px}
.tbl .arrow .ico{width:14px;height:14px;margin-top:3px;color:var(--brand)}
.tbl .fr{white-space:nowrap;font-variant-numeric:tabular-nums}
